# liveapp-dependabot-version: 2
# Dependabot — installed by the Live App Contract engine (dependency hygiene).
# Automated dependency + security update PRs; the loop drives them to mergeable like any other.
# cooldown = minimum package-age soak (supply-chain defense): don't adopt a release day-zero.
# groups  = batch minor+patch bumps into one PR (fewer PRs for the loop to drive); majors stay solo.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

name = "released-og"
main = "src/index.tsx"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Service Binding to the main web Worker. web-og fetches result data from web
# via this binding so the heavy WASM rasterizer stays out of web's bundle (D20, D23).
# Deploy `web` first; this binding requires it to exist.
[[services]]
binding = "WEB"
service = "released-web"

# Shared secret marker so the web Worker can reject direct public hits to
# /internal/result/* and only accept calls coming through this binding.
# Set with: wrangler secret put INTERNAL_SECRET (must match the value set on web).

# ─────────────────────────────────────────────────────────────────────────────
# Preview environment — isolated preview Worker paired with released-web-preview
# (issue #70). Bindings are non-inheritable in a named env, so the Service
# Binding is re-declared here pointed at the PREVIEW web Worker (not prod), so an
# OG render on the preview exercises the preview web's branch end-to-end.
# Deployed from .github/workflows/preview.yml AFTER released-web-preview (the
# binding target must exist first). INTERNAL_SECRET is set per-env (see below).
[env.preview]
name = "released-web-og-preview"

[[env.preview.services]]
binding = "WEB"
service = "released-web-preview"

name = "released-web"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Static assets (self-hosted Geist fonts under /fonts/*.woff2).
# Keeps visitor IPs on our edge instead of googleapis/gstatic.
[assets]
directory = "./public"

# Set with: wrangler secret put GITHUB_TOKEN
# This is the SHARED server-side token. PAT-paste is per-user via X-User-Github-Token header.

# GitLab federation secrets (set via `wrangler secret put`):
#   GITLAB_TOKEN                       — gitlab.com PAT. Used for gitlab.com ONLY;
#                                        it is never sent to other instances
#                                        (GitLab PATs are instance-scoped — a
#                                        gitlab.com token 401s elsewhere and
#                                        leaks the secret to a third-party host).
#   GITLAB_TOKEN_GITLAB_GNOME_ORG      — per-host PAT (host uppercased, '.' '-' → '_')
#   GITLAB_TOKEN_GITLAB_FREEDESKTOP_ORG
#   ...etc
# A host with no matching per-host secret falls back to anonymous. Anonymous
# calls from Workers share the edge IP's budget and exhaust quickly, so set a
# per-host PAT for any instance you expect meaningful federation traffic to.

# Vars (non-secret config).
#   ANUBIS_HOSTS       — hosts routed through the relay container (below). These
#                        sit behind Anubis, which challenges workerd's TLS
#                        fingerprint; the relay (Node) gets through. An empty
#                        string disables the relay. Defaults are baked into
#                        src/relay.ts; set here to make it auditable + adjustable.
#   EXTRA_GITLAB_HOSTS — extend the known-GitLab-hosts allowlist with self-hosted
#                        instances, e.g. "git.example.com,gitlab.acme.net".
[vars]
ANUBIS_HOSTS = "gitlab.freedesktop.org,gitlab.gnome.org"
# EXTRA_GITLAB_HOSTS = "git.example.com,gitlab.acme.net"

# Version metadata: exposes the deployed version's id/tag/timestamp at runtime
# (env.CF_VERSION_METADATA), surfaced read-only at GET /version so the
# maintaining loop can confirm which version is live. Populated automatically on
# every deploy; absent in `wrangler dev` and tests (the route degrades to nulls).
[version_metadata]
binding = "CF_VERSION_METADATA"

# Anubis-bypass relay container.
# gitlab.freedesktop.org / gitlab.gnome.org sit behind Anubis (techaro.lol),
# which fingerprints the caller's TLS/HTTP2 stack BELOW the API-auth layer and
# challenges workerd. Node's fingerprint (the CLI) is not. This container runs
# that same Node fetch, so the Worker can relay blocked-host API calls through
# it. The Worker still runs the whole findRelease algorithm; the container only
# ferries raw upstream bytes, gated by RELAY_SECRET + an SSRF allowlist.
# Source: container/ + src/relay.ts.
#
# One-time setup:
#   wrangler secret put RELAY_SECRET            # shared Worker↔container secret
# CI note: the Cloudflare API token used by release.yml must include the
#   Containers (Cloudchamber) edit permission, and the deploy runner needs Docker
#   (GitHub-hosted ubuntu runners have it) to build the image.
[[containers]]
class_name = "GitlabRelay"
image = "./Dockerfile"
name = "released-gitlab-relay"
max_instances = 1

[[durable_objects.bindings]]
class_name = "GitlabRelay"
name = "RELAY"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GitlabRelay"]

# Usage tracking (server-side, no client JS). One data point per request; see
# src/analytics.ts for the schema and scripts/stats.mjs for the queries. The
# dataset is created automatically on first write — no manual provisioning.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "released_events"

# Once web-og is deployed, uncomment to give web-og a service binding to this Worker:
# (configured FROM web-og's wrangler.toml — see packages/web-og/wrangler.toml)

# ── Branch-preview environment (issue #70) ──────────────────────────────────
# A per-PR preview deploy of THIS Worker, isolated from prod so a PR can be
# EXERCISED live before merge (a green gate is not a working deploy). A distinct
# name means a distinct secret store, so a preview deploy can never touch prod
# creds — the wrangler footgun that caused the #110 outage.
#
# BINDING tables are NOT inherited into a named env in wrangler (only main/
# compatibility_*/assets/observability + top-level vars/version-independent keys
# carry over), so isolation here is expressed by OMITTING the prod-only outbound
# bindings, not by pointing them elsewhere. Verified with wrangler 4.90.1's own
# `unstable_readConfig({ env: 'preview' })` and asserted in
# test/wrangler-preview-env.test.ts (which resolves this config the way the
# deploy does, catching inline-array binding forms too):
#   • no [[containers]] and no [[durable_objects.bindings]] → the Anubis relay is
#     absent; relay.ts needs BOTH the RELAY binding and RELAY_SECRET (plus a
#     non-empty ANUBIS_HOSTS), so it skips the relay and blocked hosts
#     (freedesktop/GNOME) degrade to the CLI-hint card — never a hard fail
#     (see priorities.md "graceful degradation").
#   • no [[analytics_engine_datasets]] → analytics.ts optional-chains ANALYTICS,
#     so preview traffic writes NOTHING to the prod `released_events` dataset the
#     maintaining loop reads back for error stats — no pollution of the signal.
# CAUTION: only BINDINGS are non-inheritable. Most other top-level keys DO
# inherit into a named env — including `migrations` and `routes`/`route`. So:
#   • `migrations` is overridden to [] below. Otherwise the v1 migration
#     (`new_sqlite_classes = ["GitlabRelay"]`) inherits and the first preview
#     upload tries to provision a Container-backed DO SQLite class with no
#     [[containers]] config — a dangling class at best, a failed upload at worst.
#     Empty migrations + no DO binding = GitlabRelay is inert exported code.
#   • do NOT move the prod custom domain into a top-level `routes = [...]`: it
#     would inherit here and attach the secrets-less preview Worker to the prod
#     route. The domain stays a dashboard binding, off this file, on purpose.
# The self-hosted fonts under /fonts/ still serve (assets is inherited).
#
# Human cloud steps to activate (create nothing here): Cloudflare Workers Builds
# with CLOUDFLARE_ENV=preview on non-default branches, wired to run
# `versions upload` (not `deploy`) so a preview never re-deploys prod. The
# activation runbook is tracked on issue #70.
[env.preview]
name = "released-web-preview"

# migrations IS inheritable (unlike bindings) — override to empty so the preview
# never inherits prod's GitlabRelay DO migration (see the CAUTION block above).
migrations = []

[env.preview.vars]
# Relay off in preview: empty string disables it (relay.ts anubisHostsFromEnv),
# belt-and-suspenders on top of the omitted RELAY binding above.
ANUBIS_HOSTS = ""

# version_metadata is a binding, so it is NOT inherited — redeclare it so GET
# /version reports a real tag on the preview (the liveness probe reads it).
[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"
